name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Build Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Locate and Package APK
        id: locate_apk
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" nibm-slate.apk
          ls -lh nibm-slate.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nibm-slate-apk
          path: nibm-slate.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-apk"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          gh release create "$TAG_NAME" nibm-slate.apk \
            --title "NIBM Slate Android APK ($TAG_NAME)" \
            --notes "Standalone Android APK package for NIBM Slate Mobile Companion App. Direct installable file for all instructors and demonstrators." \
            --clobber || true
